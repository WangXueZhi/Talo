[package]
name = "project-memory-desktop"
version = "0.14.2"
description = "Native desktop access to Talo"
authors = ["WangXueZhi"]
license = "Apache-2.0"
repository = "https://github.com/WangXueZhi/Talo"
edition = "2021"

[[bin]]
name = "project-memory-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2.11.3", features = [] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
