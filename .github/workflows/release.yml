name: Publish Talo Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, for example v0.14.1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - id: version
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "Tag $TAG does not match package version v$VERSION." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  portable:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/package-release.mjs
        env:
          TALO_RELEASE_SCOPE: portable
      - uses: actions/upload-artifact@v4
        with:
          name: talo-portable
          path: |
            release/talo-agent-skill-*.zip
            release/talo-codex-plugin-*.zip
            release/talo-release-manifest-*-linux-*.json
            release/SHA256SUMS-*-linux-*.txt
          if-no-files-found: error

  desktop:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: app,dmg
            artifact: talo-macos
            files: |
              release/talo-desktop-*-macos-*.dmg
              release/talo-desktop-*-macos-*.zip
              release/talo-release-manifest-*-darwin-*.json
              release/SHA256SUMS-*-darwin-*.txt
          - os: windows-latest
            bundle: nsis
            artifact: talo-windows
            files: |
              release/talo-desktop-*-windows-x64-setup.exe
              release/talo-release-manifest-*-win32-*.json
              release/SHA256SUMS-*-win32-*.txt
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --dir apps/desktop tauri build --bundles ${{ matrix.bundle }}
      - run: node scripts/package-release.mjs
        env:
          TALO_RELEASE_SCOPE: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    needs: [metadata, portable, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: talo-*
          path: release-assets
          merge-multiple: true
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --verify-tag \
              --title "Talo $VERSION" \
              --generate-notes
          fi
          gh release upload "$TAG" release-assets/* --clobber
